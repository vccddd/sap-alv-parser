[project]
name = "sap-alv-parser"
version = "0.3.0"
description = "Parser for SAP ALV fixed-width `|`-delimited reports"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "vccddd" },
]
keywords = ["sap", "alv", "parser", "fixed-width", "text-export"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Topic :: Text Processing",
]
# 核心解析是纯 stdlib 实现；pandas/prettytable 仅供 to_pandas()/to_prettytable() 使用
dependencies = []

[project.optional-dependencies]
pandas = [
    "pandas>=2.2",
]
pretty = [
    "prettytable>=3.0",
]

[project.urls]
Repository = "https://github.com/vccddd/sap-alv-parser"

[project.scripts]
sap-alv-parse = "sap_alv_parser.cli:main"

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pandas>=2.2",      # test_to_pandas 需要
    "pyright>=1.1.411",
    "pytest>=9.1.1",
]
